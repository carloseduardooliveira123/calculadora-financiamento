name: Atualizar parametros dos bancos

# Roda toda SEGUNDA de manha (08:00 BRT = 11:00 UTC) e tambem pode ser
# disparado manualmente pelo botao "Run workflow" na aba Actions.
on:
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  pull-requests: write
  issues: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar identidade do git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Verificar e atualizar parametros com Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --allowedTools Read,Edit,Bash,WebSearch,WebFetch
            --model claude-sonnet-5
            --max-turns 40
          prompt: |
            Voce mantem atualizados os parametros de financiamento imobiliario da calculadora do corretor Cal Oliveiras, publicada a partir deste repositorio (GitHub Pages e Netlify). Os valores aparecem para clientes reais.

            ARQUIVO ALVO: params.js (na raiz do repositorio). E um arquivo pequeno, SO com parametros, lido pelas DUAS ferramentas do site (index.html = Calculadora e imovel/index.html = Poder de Compra). NAO edite os HTML.

            Dentro do params.js os parametros estao em:
            - const MCMV_FAIXAS = [...]  (faixas 1 a 4: rendaMax e tetoImovel)
            - const TETO_SFH = 2250000
            - const TERRENO = { ltv, prazoMax, limiteMax, valorMin, taxaNominal, cetEfetivo }  (lote urbanizado / terreno puro)
            - const BANCOS = {...}  (10 bancos; campos numericos: taxa, ltvNovo, ltvUsado, prazoMax, limiteMax; alguns tem terreno: true e terrenoLtv)
            E o carimbo de data: const DATA_VERIFICACAO = 'DD/MM/AAAA'; (aparece no rodape das duas ferramentas)

            O params.js e pequeno (~100 linhas): pode ler ele inteiro de uma vez. NAO leia os arquivos HTML.

            SEJA EFICIENTE (ha limite de turnos): agrupe as buscas (ex.: uma busca por "taxas financiamento imobiliario bancos 2026" cobre varios bancos de uma vez; faca NO MAXIMO 6 buscas no total (2-3 paginas comparativas ja cobrem os 10 bancos)), evite releituras desnecessarias, e assim que terminar as edicoes FACA O COMMIT E O PUSH IMEDIATAMENTE (passo 5) antes de qualquer resumo. O resumo final deve ser curto (ate 10 linhas).

            TAREFA (faca hoje):
            1. Descubra a data de hoje rodando no Bash: date +%d/%m/%Y
            2. Pesquise na web os valores VIGENTES HOJE, priorizando fontes oficiais/confiaveis (caixa.gov.br e simulador oficial da Caixa, sites dos bancos, gov.br/cidades e portarias do Ministerio das Cidades, Banco Central/bcb.gov.br e resolucoes do CMN, e imprensa economica reconhecida):
               - Taxa de juros (a.a.) de financiamento imobiliario de cada banco: Caixa, BB, Itau, Bradesco, Santander, BRB, Inter, Sicredi, Sicoob, Viacredi (Ailos).
               - Teto do SFH (hoje R$ 2.250.000) e % maximo financiado para imovel NOVO e USADO (entrada minima).
               - Faixas do MCMV (1 a 4): renda maxima e teto do imovel. Referencia atual: Faixa 4 = renda ate R$ 13.000, imovel ate R$ 600.000, juros ate 9,9% a.a. (Portaria MCID 333/2026).
               - TERRENO (lote urbanizado): cota maxima, prazo maximo e taxa da modalidade Caixa "SBPE - Aquisicao de Lote Urbanizado". Referencia confirmada no simulador OFICIAL da Caixa em jul/2026: cota 80%, prazo 240 meses, SAC/TR, juros nominais 12,73% a.a. (efetivos 13,50%), sem FGTS, fora do MCMV. Cotas por banco hoje: Caixa 80, Sicoob 80, Bradesco 70 (campo terrenoLtv).
            3. Compare com os valores atuais no params.js. Para cada divergencia confirmada por fonte confiavel E MAIS RECENTE que a referencia citada, use a ferramenta Edit para alterar APENAS o numero correspondente (sem quebrar a sintaxe JS, sem mexer em textos/estrutura/estilo).
            4. SEMPRE atualize o DATA_VERIFICACAO para a data de hoje (DD/MM/AAAA), mesmo que nada mais mude.
            5. Publique as mudancas rodando no Bash:
               git add params.js
               git commit -m "chore: atualiza parametros dos bancos $(date +%F)"
               git push origin HEAD:main

            REGRAS DE SEGURANCA (os valores aparecem para clientes reais):
            - NUNCA invente numeros. So altere um parametro se houver fonte publica, confiavel e datada confirmando o novo valor. Na duvida, mantenha o valor atual e relate a duvida.
            - ARMADILHA CONHECIDA: a FAQ antiga da Caixa sobre lote urbanizado (70% SAC / 60% PRICE) esta DESATUALIZADA e saiu do ar; conteudo antigo em cache de buscador NAO e fonte valida. NAO regredir a cota de terreno para 70% com base nisso. So altere terreno com fonte claramente mais recente que jul/2026.
            - Mantenha ltvNovo >= ltvUsado e terrenoLtv <= ltvUsado.
            - Nao altere estrutura, comentarios ou nomes de campos do params.js, apenas os numeros dos parametros e a data. NUNCA edite index.html, imovel/index.html ou estilo.css.
            - Se nada (alem da data) mudar, ainda assim faca o commit/push so com a data atualizada.

            Ao final, escreva um resumo: o que verificou, o que mudou (antigo -> novo + fonte + data da fonte), o que ficou em duvida, e confirme se o push foi concluido.

      # Aviso automatico: se o robo mudou algum PARAMETRO (nao so a data),
      # abre uma Issue no repositorio -> o GitHub envia e-mail ao dono.
      # Custo zero (nao usa API da Anthropic nem servico externo).
      - name: Avisar se algum parametro mudou (Issue -> e-mail do GitHub)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          git fetch origin main
          HEAD=$(git rev-parse origin/main)
          if [ "$BASE" = "$HEAD" ]; then
            echo "Robo nao publicou nada nesta rodada."
            exit 0
          fi
          DIFF=$(git diff "$BASE" "$HEAD" -- params.js | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -v 'DATA_VERIFICACAO' || true)
          if [ -z "$DIFF" ]; then
            echo "So a data de verificacao mudou — sem aviso."
            exit 0
          fi
          {
            echo "O robo semanal alterou parametros das ferramentas (simule-aqui.netlify.app e /imovel)."
            echo
            echo "Linhas removidas (-) e adicionadas (+) no params.js:"
            echo
            echo '```diff'
            echo "$DIFF"
            echo '```'
            echo
            echo "Commit: https://github.com/$REPO/commit/$HEAD"
            echo
            echo "Se algum valor estiver errado, corrija no params.js (ou peca ao Claude) — o site republica sozinho."
          } > /tmp/aviso.md
          gh issue create \
            --title "📊 Parametros alterados pelo robo — $(date +%d/%m/%Y)" \
            --body-file /tmp/aviso.md
