# Configuração de deploy do Netlify — duas ferramentas no mesmo site:
#   /         = Calculadora de Financiamento (index.html)
#   /imovel/  = Poder de Compra (imovel/index.html)
[build]
  publish = "."
  command = ""

# Funções serverless (recebem o lead e repassam ao CRM)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
